name: Maven Security-First Deploy

on:
  push:
    branches: [ master ] # Runs every time you push to master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # This allows the worker to host the package

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github # Matches the ID in your pom.xml
          settings-path: ${{ github.workspace }} # Auto-generates a temporary settings.xml

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub